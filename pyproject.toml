[project]
name = "cogniforge"
version = "0.1.0"
description = "AI-driven software engineering pipeline — from PRD to production"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "click>=8",
    "gitpython>=3",
    "pyyaml>=6",
    "anthropic>=0.102.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cogniforge"]

[dependency-groups]
dev = [
    "pytest>=8",
]
