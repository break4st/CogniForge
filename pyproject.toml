[project]
name = "cogniforge"
version = "0.1.0"
description = "AI-driven software engineering pipeline — from PRD to production"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "click>=8",
    "gitpython>=3",
    "pyyaml>=6",
    "openai>=1.0",
    "jsonschema>=4.20",
    "jsonpatch>=1.33",
]

[project.scripts]
cogniforge = "cogniforge.cli:cli"
cf = "cogniforge.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cogniforge"]

[dependency-groups]
dev = [
    "pytest>=8",
]
windows = [
    "pyreadline3>=2",
]
